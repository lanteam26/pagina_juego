<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelo de Naciones 3D 🥊</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Rajdhani',sans-serif; color:#fff; }

  /* Canvas 3D a pantalla completa SIEMPRE visible */
  #escena3d { position:fixed; inset:0; display:block; width:100vw; height:100vh; z-index:0; }

  /* UI encima */
  #ui { position:fixed; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; }

  .hud { display:flex; justify-content:space-between; gap:8px; padding:14px 16px; font-family:'Orbitron'; }
  .pill { padding:8px 16px; border-radius:10px; font-size:.8rem; font-weight:700; letter-spacing:1px;
    border:1px solid rgba(0,240,255,.45); color:#00f0ff; background:rgba(0,10,20,.6);
    backdrop-filter:blur(8px); box-shadow:0 0 18px rgba(0,240,255,.25); }
  .pill.combo { border-color:#ffd60a; color:#ffd60a; }
  .pill.combo.on { animation:pulso .6s infinite alternate; }
  @keyframes pulso { to{ transform:scale(1.08); } }

  .vidas { display:flex; justify-content:space-between; padding:0 16px; gap:20px; }
  .vida-bloque { flex:1; max-width:340px; }
  .vida-bloque.der { text-align:right; }
  .vida-nombre { font-family:'Orbitron'; font-size:.72rem; letter-spacing:1px; color:#c8d4ff; margin-bottom:4px; text-shadow:0 0 8px rgba(0,240,255,.5); }
  .vida-barra { height:18px; border-radius:10px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); overflow:hidden; }
  .vida-fill { height:100%; width:100%; border-radius:10px; transition:width .5s cubic-bezier(.22,1,.36,1); }
  .vida-fill.jugador { background:linear-gradient(90deg,#00f0ff,#39ff14); box-shadow:0 0 16px rgba(0,240,255,.7); }
  .vida-fill.enemigo { background:linear-gradient(90deg,#ff2e88,#ff3131); box-shadow:0 0 16px rgba(255,46,136,.7); float:right; }

  .accion { margin-top:auto; padding:16px; pointer-events:auto; background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0)); }
  .pregunta { text-align:center; font-size:1.15rem; font-weight:700; margin-bottom:12px; color:#e6ecff; text-shadow:0 0 14px rgba(0,240,255,.4); }
  .pregunta .bandera-grande { font-size:2.2rem; vertical-align:middle; filter:drop-shadow(0 0 14px rgba(0,240,255,.7)); }
  .opciones { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:720px; margin:0 auto; }
  @media(max-width:600px){ .opciones{ grid-template-columns:1fr; } }
  .opcion { font-family:'Rajdhani'; font-weight:700; font-size:1.05rem; padding:14px; border-radius:12px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg, rgba(0,240,255,.12), rgba(255,46,136,.12));
    border:2px solid rgba(0,240,255,.4); transition:.15s; backdrop-filter:blur(6px); }
  .opcion:hover:not(:disabled) { border-color:#00f0ff; box-shadow:0 0 24px rgba(0,240,255,.6); transform:translateY(-2px); }
  .opcion:disabled { cursor:default; opacity:.9; }
  .opcion.correcta { background:linear-gradient(135deg,#39ff14,#00f0ff); color:#0a0a1a; border-color:#39ff14; box-shadow:0 0 28px rgba(57,255,20,.8); }
  .opcion.incorrecta { background:linear-gradient(135deg,#ff3131,#ff2e88); border-color:#ff3131; }

  #inicio { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 50%, rgba(26,11,46,.85), rgba(0,0,0,.97)); padding:20px; }
  #inicio.oculto { display:none; }
  #inicio .logo { font-family:'Orbitron'; font-weight:900; font-size:clamp(2rem,6vw,4rem); line-height:1.05; letter-spacing:3px;
    background:linear-gradient(90deg,#00f0ff,#ff2e88,#ffd60a,#00f0ff); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:brillo 4s linear infinite; filter:drop-shadow(0 0 22px rgba(0,240,255,.6)); margin-bottom:10px; }
  @keyframes brillo { to{ background-position:300% 0; } }
  #inicio .sub { color:#9db4ff; font-size:1.15rem; margin-bottom:18px; }
  #inicio .record-ini { display:inline-block; margin-bottom:24px; padding:8px 22px; border-radius:30px; border:1px solid #ffd60a; color:#ffd60a; font-weight:700; box-shadow:0 0 18px rgba(255,214,10,.4); }
  .btn-grande { font-family:'Orbitron'; font-weight:900; font-size:1.25rem; letter-spacing:2px; padding:18px 54px; border:none; border-radius:50px; cursor:pointer; color:#0a0a1a;
    background:linear-gradient(135deg,#00f0ff,#39ff14); box-shadow:0 0 28px rgba(0,240,255,.7), 0 8px 24px rgba(0,0,0,.6); transition:.18s; text-transform:uppercase; }
  .btn-grande:hover { transform:translateY(-3px) scale(1.04); }
  .btn-grande:active { transform:scale(.96); }

  .overlay { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;
    background:rgba(0,0,0,.85); backdrop-filter:blur(6px); animation:entrar .3s; }
  @keyframes entrar { from{ opacity:0; } to{ opacity:1; } }
  .overlay h2 { font-family:'Orbitron'; font-weight:900; font-size:clamp(2rem,7vw,3.5rem);
    background:linear-gradient(90deg,#ffd60a,#ff2e88,#00f0ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:pulso .6s infinite alternate; margin-bottom:10px; }
  .overlay p { color:#9db4ff; font-size:1.2rem; margin-bottom:24px; }
  .trofeo { font-size:6rem; animation:flotar2 1.6s ease-in-out infinite; filter:drop-shadow(0 0 34px rgba(255,214,10,.9)); }
  @keyframes flotar2 { 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-16px) rotate(4deg); } }
  .stats { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:20px 0; }
  .stat { background:rgba(0,240,255,.1); border:1px solid rgba(0,240,255,.4); border-radius:14px; padding:14px 22px; min-width:110px; }
  .stat .num { font-family:'Orbitron'; font-size:1.7rem; font-weight:900; color:#00f0ff; }
  .stat .lbl { font-size:.78rem; color:#9db4ff; letter-spacing:1px; }
  .nuevo-record { color:#ffd60a; font-family:'Orbitron'; font-weight:900; font-size:1.2rem; margin:10px 0; animation:pulso .5s infinite alternate; }

  .dano { position:fixed; font-family:'Orbitron'; font-weight:900; font-size:2rem; pointer-events:none; z-index:40;
    animation:danoSube 1s ease-out forwards; text-shadow:0 0 12px currentColor; }
  @keyframes danoSube { 0%{opacity:1; transform:translateY(0) scale(.6);} 30%{transform:translateY(-20px) scale(1.3);} 100%{opacity:0; transform:translateY(-90px) scale(1);} }

  .texto-fx { position:fixed; top:42%; left:50%; transform:translate(-50%,-50%);
    font-family:'Orbitron'; font-weight:900; font-size:clamp(1.6rem,6vw,3rem); z-index:41; pointer-events:none;
    animation:textoFx 1.1s ease-out forwards; text-shadow:0 0 30px currentColor; }
  @keyframes textoFx { 0%{opacity:0; transform:translate(-50%,-50%) scale(.4);} 25%{opacity:1; transform:translate(-50%,-50%) scale(1.2);} 70%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.4);} }

  .btn-sonido { position:fixed; top:14px; right:14px; z-index:50; background:rgba(0,240,255,.15);
    border:1px solid rgba(0,240,255,.5); color:#00f0ff; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.05rem; }
</style>
</head>
<body>

<canvas id="escena3d"></canvas>

<div id="ui">
  <div class="hud">
    <div class="pill" id="hudNivel">NIVEL 1/5</div>
    <div class="pill combo" id="hudCombo">🔥 COMBO x0</div>
    <div class="pill" id="hudPuntos">⭐ 0</div>
  </div>

  <div class="vidas">
    <div class="vida-bloque izq">
      <div class="vida-nombre">🦸 TÚ — <span id="vidaJugadorTxt">100</span></div>
      <div class="vida-barra"><div class="vida-fill jugador" id="vidaJugador"></div></div>
    </div>
    <div class="vida-bloque der">
      <div class="vida-nombre"><span id="enemigoNombre">RIVAL</span> — <span id="vidaEnemigoTxt">100</span> 👹</div>
      <div class="vida-barra"><div class="vida-fill enemigo" id="vidaEnemigo"></div></div>
    </div>
  </div>

  <div class="accion" id="accion" style="display:none">
    <div class="pregunta" id="pregunta"></div>
    <div class="opciones" id="opciones"></div>
  </div>
</div>

<button class="btn-sonido" id="btnSonido" onclick="toggleSonido()">🔊</button>

<div id="inicio">
  <div class="logo">DUELO DE<br>NACIONES 3D</div>
  <p class="sub">🥊 Combate en la arena del mundo 🥊</p>
  <div class="record-ini" id="recordIni">🏆 Récord: 0 pts</div><br>
  <button class="btn-grande" onclick="iniciarJuego()">PELEAR ▶</button>
</div>

<!-- Three.js por CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="juego.js"></script>
</body>
</html>
